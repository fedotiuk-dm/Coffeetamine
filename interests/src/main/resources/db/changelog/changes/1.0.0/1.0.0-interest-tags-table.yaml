databaseChangeLog:
  - changeSet:
      id: interests-1.0.0-create-interest-tags
      author: fedotiuk-dm
      comment: Fixed global interest tag catalog. Tags are soft-deactivated via active=false.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: interest_tags
      changes:
        - createTable:
            tableName: interest_tags
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_interest_tags_code
              - column:
                  name: display_name
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: int
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_interest_tags_catalog
            tableName: interest_tags
            columns:
              - column:
                  name: active
              - column:
                  name: category
              - column:
                  name: sort_order
              - column:
                  name: display_name
