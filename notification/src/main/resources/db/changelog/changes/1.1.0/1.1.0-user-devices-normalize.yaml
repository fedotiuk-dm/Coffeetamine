databaseChangeLog:
  - changeSet:
      id: notification-1.1.0-normalize-user-devices
      author: fedotiuk-dm
      comment: |
        Normalize user_devices from one-row-per-user (JSONB device array) to one-row-per-device.
        Greenfield — no data to migrate — so drop the 1.0.0 JSONB table and recreate normalized.
        Unique (app_user_id, platform, token) gives DB-level dedup; register / unregister become
        single-row insert / update / delete instead of a read-modify-write of the whole JSONB array.
        Forward-only evolution of the 1.0.0 baseline.
      changes:
        - dropTable:
            tableName: user_devices
        - createTable:
            tableName: user_devices
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_devices
                    nullable: false
              - column:
                  name: app_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: platform
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(4096)
                  constraints:
                    nullable: false
              - column:
                  name: app_version
                  type: varchar(50)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_devices
            constraintName: uk_user_devices_user_platform_token
            columnNames: app_user_id, platform, token
        - createIndex:
            tableName: user_devices
            indexName: idx_user_devices_app_user
            columns:
              - column:
                  name: app_user_id
