# Liquibase Maven plugin — local dev defaults.
#
# Read by the `liquibase-maven-plugin` block in main/pom.xml. Lets you run
# `mvn -pl main -am liquibase:update` (and friends: status, rollback, validate)
# without copy-pasting connection params. IntelliJ → Maven view → main →
# Plugins → liquibase → liquibase:update also picks these up.
#
# These mirror docker-compose.dev.yml defaults. Override for other environments
# either via env vars passed to Maven or via the CLI:
#   mvn -pl main -am liquibase:update \
#     -Dliquibase.url=jdbc:postgresql://prod-host:5432/db \
#     -Dliquibase.username=... -Dliquibase.password=...

url=jdbc:postgresql://localhost:5432/coffeetamine
username=coffeetamine
password=coffeetamine
