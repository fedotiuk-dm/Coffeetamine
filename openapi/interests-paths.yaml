---
openapi: 3.0.4
info:
  title: Coffeetamine Interests API
  description: |
    Fixed global interest-tag catalog and per-user tag selections. Used by discovery
    for compatibility scoring (interest overlap normalised to 1..100).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://localhost:8443
    description: Local development server

tags:
  - name: interests
  - name: admin-interests
  - name: my-interests

paths:
  /api/interests:
    get:
      tags:
        - interests
      summary: List interest tags
      description: "Paginated list of interest tags in the global catalog. **Authorization**: any authenticated user."
      operationId: listInterests
      x-spring-paginated: true
      parameters:
        - $ref: "common.yaml#/components/parameters/Search"
        - name: category
          in: query
          description: Filter by category code (e.g., MUSIC, FOOD)
          schema:
            type: string
            maxLength: 50
            pattern: "^[A-Z0-9_]+$"
        - name: activeOnly
          in: query
          description: If true (default), only active tags are returned
          schema:
            type: boolean
            default: true
        - $ref: "common.yaml#/components/parameters/PageNumber"
        - $ref: "common.yaml#/components/parameters/PageSize"
        - $ref: "common.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: Interest tags
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/InterestListResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        default:
          $ref: "common.yaml#/components/responses/default"

  /api/interests/{id}:
    get:
      tags:
        - interests
      summary: Get interest tag by ID
      description: "Returns a single interest tag. **Authorization**: any authenticated user."
      operationId: getInterest
      parameters:
        - name: id
          in: path
          required: true
          description: Interest tag ID
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Interest tag
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/Interest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        default:
          $ref: "common.yaml#/components/responses/default"

  /api/admin/interests:
    post:
      tags:
        - admin-interests
      summary: Create interest tag
      description: "Creates a new interest tag in the catalog. **Authorization**: ADMIN role required."
      operationId: createInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "interests-schemas.yaml#/components/schemas/CreateInterestRequest"
      responses:
        "201":
          description: Interest tag created
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/Interest"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "common.yaml#/components/responses/Conflict"
        default:
          $ref: "common.yaml#/components/responses/default"

  /api/admin/interests/{id}:
    put:
      tags:
        - admin-interests
      summary: Update interest tag
      description: "Updates an existing interest tag. **Authorization**: ADMIN role required."
      operationId: updateInterest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "interests-schemas.yaml#/components/schemas/UpdateInterestRequest"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/Interest"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        default:
          $ref: "common.yaml#/components/responses/default"
    delete:
      tags:
        - admin-interests
      summary: Soft-delete interest tag
      description: "Marks an interest tag as inactive (does not delete the row). Existing user selections referencing it are preserved. **Authorization**: ADMIN role required."
      operationId: deleteInterest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "204":
          description: Interest tag deactivated
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        default:
          $ref: "common.yaml#/components/responses/default"

  /api/users/me/interests:
    get:
      tags:
        - my-interests
      summary: Get my selected interests
      description: "Returns the authenticated user's selected interest tags (full Interest objects, in selection order)."
      operationId: getMyInterests
      responses:
        "200":
          description: My selected interests
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/UserInterestsResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        default:
          $ref: "common.yaml#/components/responses/default"
    put:
      tags:
        - my-interests
      summary: Replace my selected interests
      description: |
        Atomically replaces the authenticated user's interest selections with the
        provided list. The list is ordered (preserved on read). Requires onboarding to be
        completed — returns **404 with `errorCode: USER_002`** otherwise.
        **Authorization**: any authenticated user.
      operationId: replaceMyInterests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "interests-schemas.yaml#/components/schemas/UpdateUserInterestsRequest"
      responses:
        "200":
          description: Updated selections
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/UserInterestsResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "404":
          description: |
            Unknown interest tag (errorCode INT_TAG_001) or onboarding not yet completed
            (errorCode USER_002).
          content:
            application/problem+json:
              schema:
                $ref: "common.yaml#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/ErrorResponse"
        default:
          $ref: "common.yaml#/components/responses/default"

  /api/users/{userId}/interests:
    get:
      tags:
        - interests
      summary: Get user's selected interests
      description: "Returns another user's selected interests (public). **Authorization**: any authenticated user."
      operationId: getUserInterests
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: User's selected interests
          content:
            application/json:
              schema:
                $ref: "interests-schemas.yaml#/components/schemas/UserInterestsResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        default:
          $ref: "common.yaml#/components/responses/default"

components:
  securitySchemes:
    bearerAuth:
      $ref: "common.yaml#/components/securitySchemes/bearerAuth"

security:
  - bearerAuth: []
